services:
  sirc-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sirc
      POSTGRES_USER: sirc_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sirc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirc_user -d sirc"]
      interval: 10s
      timeout: 5s
      retries: 5

  sirc-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      sirc-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://sirc_user:${POSTGRES_PASSWORD}@sirc-db:5432/sirc?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
    expose:
      - "3000"

  sirc-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      API_INTERNAL_URL: http://sirc-api:3000
    expose:
      - "8080"

volumes:
  sirc_postgres_data:
